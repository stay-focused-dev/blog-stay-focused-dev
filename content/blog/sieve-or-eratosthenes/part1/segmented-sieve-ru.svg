<text x="276" y="254" text-anchor="start" fill="#6b6a65" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">j = 100 000 + (41 − 1)</text>
<text x="472" y="254" text-anchor="start" fill="#6b6a65" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">= 100 040</text>
